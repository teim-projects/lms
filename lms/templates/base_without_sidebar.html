{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profit Max Share Market Academy </title>
  <link rel="icon" href="{% static 'images/favicon.jpeg' %}" type="image/png">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
    }

    .teim-navbar-wrapper {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #e2e8f0;
      position: fixed;
      top: 0%;
      width: 100%;
      z-index: 1000;
      box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.05);
      padding: 10px 0;
    }

    .teim-navbar-brand img {
      transition: transform 0.3s ease, filter 0.3s ease;
      height: 65px;
    }

    .teim-navbar-brand img:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    .container-fluid.teim-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>

  <nav class="navbar teim-navbar-wrapper shadow-sm">
    <div class="container-fluid teim-container">
      <!-- Center: ProfitMax Logo -->
      <a class="teim-navbar-brand teim-logo-center" href="https://profitmaxacademy.com/">
        <img src="{% static 'images/pmxlogo_c.png' %}" alt="ProfitMax Logo">
      </a>
    </div>
  </nav>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
